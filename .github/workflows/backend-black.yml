name: Black

on:
  workflow_call:

jobs:
  black:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7
          architecture: "x64"

      - name: Установка tox
        run: pip install tox

      - name: Запуск Black
        run: tox -e black
